[package]
name = "keepass"
version = "0.18.1"
description = "KeePass .kdbx database file parser"
keywords = ["keepass", "kdbx", "password"]
categories = ["parser-implementations", "security"]
edition = "2018"
rust-version = "1.89"
repository = "https://github.com/pepa65/keepass-rs"
documentation = "https://docs.rs/keepass-rs"
authors = ["Stefan Seemayer <stefan@seemayer.de>", "<github.com/pepa65>"]
license = "MIT"
readme = "README.md"
include = ["src/", "README.md", "LICENSE"]

[dependencies]
thiserror = "2"

# encoding and parsing
byteorder = "1"
flate2 = "1"
base64 = "0.23"
serde = { version = "1",  features = ["derive"] }
quick-xml = { version = "0.42", features = ["serialize"] }
hex-literal = "1"
secrecy = "0.10.3"
chrono = { version = "0.4.23", default-features = false, features = ["serde", "clock", "std"] }

# cryptography
rust-argon2 = "3.0"
sha2 = { version = "0.11", features = ["zeroize"] }
aes = { version = "0.9", features = ["zeroize"] }
block-modes = "0.9"
hmac = { version = "0.13", features = ["zeroize"] }
salsa20 = { version = "0.11", features = ["zeroize"] }
chacha20 = { version = "0.10", features = ["zeroize"] }
cipher = { version = "0.5", features = ["block-padding", "alloc", "zeroize"] }
twofish = { version = "0.8", features = ["zeroize"] }
cbc = { version = "0.2", features = ["zeroize"] }

uuid = { version = "1.18.1", features = ["v4", "serde"] }
indexmap = { version = "2", features = ["serde"] }
hex = { version = "0.4" }
hybrid-array = { version = "0.4", features = ["zeroize"] }
getrandom = { version = "0.4", features = ["std"] }
zeroize = { version = "1", features = ["zeroize_derive"] }

# dependencies for totp
sha1 = { version = "0.11", features = ["zeroize"] }
url = "2.2"
base32 = "0.5"

[dev-dependencies]
rand = "0.10"
tempfile = "3"
test-with = "0.17"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }
missing_docs = "warn"
rust_2018_idioms = "warn"

[lints.clippy]
indexing_slicing = "deny"
missing_panics_doc = "deny"
unwrap_used = "deny"
expect_used = "deny"
cast_lossless = "deny"
cargo = { level = "warn", priority = -1 }
